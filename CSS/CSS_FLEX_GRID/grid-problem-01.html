<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Grid Problem 1</title>
<style>
body{margin:0;background:#12b5c8;font-family:Arial}.keyboard{width:82%;margin:70px auto;padding:20px;background:#20252a;border-radius:12px;box-shadow:0 8px 20px #555;display:grid;grid-template-columns:repeat(12,1fr);gap:8px}.key{height:38px;background:#303840;color:#19a7c0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px}.wide{grid-column:span 2}.space{grid-column:span 5}</style></head><body>
<div class="keyboard">
<div class="key">~</div><div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key">0</div><div class="key">⌫</div>
<div class="key wide">TAB</div><div class="key">Q</div><div class="key">W</div><div class="key">E</div><div class="key">R</div><div class="key">T</div><div class="key">Y</div><div class="key">U</div><div class="key">I</div><div class="key">O</div><div class="key">P</div><div class="key">\</div>
<div class="key wide">CAPS</div><div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key">F</div><div class="key">G</div><div class="key">H</div><div class="key">J</div><div class="key">K</div><div class="key">L</div><div class="key">;</div><div class="key">ENTER</div>
<div class="key wide">SHIFT</div><div class="key">Z</div><div class="key">X</div><div class="key">C</div><div class="key">V</div><div class="key">B</div><div class="key">N</div><div class="key">M</div><div class="key">,</div><div class="key">.</div><div class="key wide">SHIFT</div>
<div class="key">⌘</div><div class="key">CTRL</div><div class="key">OPTION</div><div class="key">ALT</div><div class="key space">Space</div><div class="key">ALT</div><div class="key">OPTION</div><div class="key">←</div><div class="key">→</div>
</div></body></html>
