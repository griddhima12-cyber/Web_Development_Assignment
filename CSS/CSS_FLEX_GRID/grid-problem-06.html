<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Grid Problem 6</title>
<style>
body{margin:0;background:#fafafa;font-family:Arial}.calc{width:360px;margin:60px auto;padding:30px;background:white;box-shadow:0 4px 18px #ddd}.display{height:55px;border-radius:10px;box-shadow:inset 0 1px 6px #ddd;margin-bottom:18px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{height:60px;border:0;border-radius:10px;background:#fff;box-shadow:0 3px 10px #ddd;font-size:20px;font-weight:bold}.op{background:#000;color:white}.clear{background:red;color:white}</style></head><body><div class="calc"><div class="display"></div><div class="keys">
<button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key op">+</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key op">-</button>
<button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key op">×</button>
<button class="key clear">C</button><button class="key">0</button><button class="key op">=</button><button class="key op">/</button>
</div></div></body></html>
