<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Query Assignment 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px;font-family:Arial,sans-serif}
.layout{max-width:900px;margin:auto;display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
nav{grid-column:1/-1;background:#ffff00;padding:8px;font-size:28px}
.box{height:140px;padding:8px;font-size:16px}
.box1{background:#ff0000}.box2{background:#00f02a}.box3{background:#565de5}.box4{background:#999}
@media(max-width:700px){
.layout{grid-template-columns:repeat(2,1fr)}
nav{font-size:30px}
}
@media(max-width:450px){
.layout{grid-template-columns:1fr}
nav{font-size:32px}
}
</style>
</head>
<body>
<div class="layout">
<nav>Navigation</nav>
<div class="box box1">Box 1</div>
<div class="box box2">Box 2</div>
<div class="box box3">Box 3</div>
<div class="box box4">Box 4</div>
</div>
</body>
</html>
