<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Query Assignment 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px;font-family:Arial,sans-serif}
.layout{max-width:900px;margin:auto;display:grid;gap:12px;grid-template-columns:1fr 1fr;grid-template-areas:"nav nav" "one three" "two four"}
nav{grid-area:nav;background:#ffff00;padding:8px;font-size:30px}
.box{height:150px;padding:8px;font-size:18px}
.one{grid-area:one;background:#ff0000}.two{grid-area:two;background:#00f02a}
.three{grid-area:three;background:#565de5}.four{grid-area:four;background:#999}
@media(max-width:700px){
.layout{grid-template-columns:1fr 1fr}
}
@media(max-width:450px){
.layout{grid-template-columns:1fr;grid-template-areas:"nav" "one" "four" "two" "three"}
.box{height:145px}
}
</style>
</head>
<body>
<div class="layout">
<nav>Navigation</nav>
<div class="box one">Box 1</div>
<div class="box two">Box 2</div>
<div class="box three">Box 3</div>
<div class="box four">Box 4</div>
</div>
</body>
</html>
