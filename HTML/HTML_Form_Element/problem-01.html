<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>gla application form</title>
</head>
<body>
    <h1><b><center>GLA ADMISSION FORM</center></b></h1>
    <p>
            Welcome to our College Admission Application Form.
            Please fill in all the required details carefully to apply
            for admission to your desired undergraduate program.
    </p>
<a href="https://noida.gla.ac.in/" target="_blank">
   <center> <img src="https://content.jdmagicbox.com/v2/comp/greater-noida/s9/011pxx11.xx11.230331100853.k2s9/catalogue/gla-university-knowledge-park-2-greater-noida-greater-noida-universities-lgcfqcp8ud.jpg" width =300 height="300"></center>
</a>
<fieldset>
    <legend><h1>Personal Information</h1></legend>
<form action="#" method="post"> 
    <label for ="name">NAME<mark>*</mark>:</label>
    <input type ="text" id ="name" name ="full name" placeholder= "enter your name "required ><br><br>
    <label for ="dob">DATE OF BIRTH<mark>*</mark></label>
    <input type="date" id ="dob" name="dob" required><br><br>
    <label for="email">EMAIL <mark>*</mark></label>
    <input type="email" id ="email" name ="email" reqired placeholder="xyz@gmail.com" ><br><br>
    <label for ="mobile">MOBILE NUMBER<mark>*</mark></label>
    <input type ="tel" id="mobile" name="mobile" placeholder="enter your mob" pattern="[0-9]{10}"><br><br>
    <label for ="pin">APPLICATION/PASSWORD PIN<mark>*</mark></label>
    <input type ="password" id="pin" name="pin" placeholder="pin"><br><br>
    <label >gender<mark>*</mark></label>
    <input type ="radio"  name="gender" value ="male" reqired>
    <label for ="male">MALE</label>
    <input type ="radio"  name="gender" value ="female" reqired>
    <label for ="female">FEMALE</label>
    <select id="category" name="category" required>
    <option value="">--Select Category--</option>
    <option value="general">General</option>
    <option value="obc">OBC</option>
    <option value="sc">SC</option>
    <option value="st">ST</option>
    <option value="ews">EWS</option>
</select>

<br><br>

<label for="course">COURSE / PROGRAM<mark>*</mark></label>

<select id="course" name="course" required>
    <option value="">--Select Course--</option>
    <option value="cse">B.Tech CSE</option>
    <option value="aiml">B.Tech AI & ML</option>
    <option value="ece">B.Tech ECE</option>
    <option value="me">B.Tech Mechanical</option>
    <option value="ce">B.Tech Civil</option>
    <option value="bca">BCA</option>
    <option value="bba">BBA</option>
</select>

<br><br>

<label>AREA OF INTEREST</label><br>

<input type="checkbox" id="coding" name="interest" value="coding">
<label for="coding">Coding</label>

<input type="checkbox" id="sports" name="interest" value="sports">
<label for="sports">Sports</label>

<input type="checkbox" id="music" name="interest" value="music">
<label for="music">Music</label>

<input type="checkbox" id="dance" name="interest" value="dance">
<label for="dance">Dance</label>

<br><br>

<label for="address">PERMANENT ADDRESS<mark>*</mark></label><br>

<textarea id="address" name="address"
rows="5" cols="50"
maxlength="300"
placeholder="Enter your permanent address"
required></textarea>

<br><br>

<h2>Educational Qualification</h2>

<label for="qualification">PREVIOUS QUALIFICATION<mark>*</mark></label>

<select id="qualification" name="qualification" required>
    <option value="">--Select Qualification--</option>
    <option value="10th">10th</option>
    <option value="12th">12th</option>
    <option value="diploma">Diploma</option>
    <option value="graduation">Graduation</option>
</select>

<br><br>

<label for="percentage">PERCENTAGE / CGPA<mark>*</mark></label>

<input type="number" id="percentage" name="percentage"
min="0" max="100" step="0.01"
placeholder="Enter percentage" required>

<br><br>

<label for="year">PASSING YEAR<mark>*</mark></label>

<input type="number" id="year" name="passing_year"
min="1950" max="2026"
required>

<br><br>

<label for="school">SCHOOL / COLLEGE NAME<mark>*</mark></label>

<input type="text" id="school" name="school"
minlength="3" maxlength="100" required>

<br><br>

<h2>Admission Document</h2>

<label for="document">UPLOAD DOCUMENT</label>

<input type="file" id="document" name="document"
accept=".pdf,.jpg,.jpeg,.png">

<br><br>

<label for="application_date">APPLICATION DATE<mark>*</mark></label>

<input type="date" id="application_date"
name="application_date"
min="2026-01-01"
max="2026-12-31"
required>

<br><br>

<h2>Declaration</h2>

<input type="checkbox" id="declaration"
name="declaration"
value="accepted" required>

<label for="declaration">
    I declare that all the information provided by me is
    true and correct.
</label>

<br><br>

<input type="submit" value="Submit">

<input type="reset" value="Reset">

</form>

</fieldset>

</body>
</html> 



</form>
    </fieldset>
    
</body>
</html>
